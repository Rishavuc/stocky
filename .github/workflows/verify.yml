name: Verify capstone
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: investorseye
          POSTGRES_USER: eye
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eye -d investorseye" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv
      - run: .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
      - run: .venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - run: PYTHONPATH=backend OMP_NUM_THREADS=2 .venv/bin/python -m app.research --symbol RELIANCE
      - run: PYTHONPATH=backend .venv/bin/pytest -q
      - run: mkdir -p runtime && .venv/bin/python scripts/verify_postgres.py
        env:
          DATABASE_URL: postgresql+psycopg://eye:integration-only@127.0.0.1:5432/investorseye
